# Media server configuration
server:
    host: "127.0.0.1"
    port: 8100
    # Optional SSL — set paths to serve HTTPS
    # (certs not present on this host — disabled for local testing)
    ssl_cert: "~/server.pem"
    ssl_key: "~/server-key.pem"

# Which backend to use for image generation
backend: "qwenimage21"

# LLM settings — the server proxies ALL LLM inference (prompt rewriting,
# prompt-from-images) to this OpenAI-compatible chat endpoint, so the
# browser never talks to the LLM directly (no self-signed-cert issues).
# Values may reference environment variables as ${VAR} or ${VAR:-default}.
# If endpoint / api_key are omitted (or left empty), the server falls back
# to the OPENAI_API_BASE and OPENAI_API_KEY environment variables.
llm:
    # OpenAI-compatible base endpoint (e.g. https://host:7820/v1)
    # endpoint: "https://host:7820/v1"     # or ${OPENAI_API_BASE:-}
    # API key for the endpoint (e.g. a static key for a local llama.cpp/vLLM server)
    # api_key: "secret"                    # or ${OPENAI_API_KEY:-}
    # Model name; empty = the endpoint's default model
    model: "${OPENAI_MODEL:-}"
    # Set to false to skip TLS certificate verification (self-signed certs)
    ssl_verify: true

# Backend-specific settings
backends:
    qwenimage21turbo:
        max_output_size: 1024
        # Largest edge accepted for source images during editing.
        max_input_edge: 1440
        steps: 8
        gguf: "models/qwen_image_2.1_turbo_Q4_K_S.gguf"
        base_model: "Qwen/Qwen-Image-2.1-Turbo"
        text_encoder_4bit: true
        # Custom VAE (HF repo id or local dir); omit to use the base VAE.
        # vae: "madebyollin/texture-fix-vae-for-qwen-image-2.1"
    qwenimage21:
        max_output_size: 1024
        max_input_edge: 1440
        steps: 25
        gguf: "models/qwen_image_2.1_F16.gguf"
        text_encoder_4bit: true
        # Custom VAE (HF repo id or local dir); omit to use the base VAE.
        # vae: "madebyollin/texture-fix-vae-for-qwen-image-2.1"
        # Optional LoRA adapters — first entry is active by default.
        # Per-request override: lora=<name> (or lora=none), lora_scale=<float>.
        # lora:
        #     - path: "/path/to/your-lora.safetensors"
        #       name: "my-lora"
        #       scale: 0.8
    mossimage:
        max_output_size: 1024
        steps: 50
        gguf: "models/moss_image_sft_Q4_K_S.gguf"
        base_model: "OpenMOSS-Team/MOSS-Image-SFT"
        text_encoder_4bit: true
    mossimage8:
        max_output_size: 1024
        steps: 8
        gguf: "models/moss_image_sft_Q4_K_S.gguf"
        base_model: "OpenMOSS-Team/MOSS-Image-SFT"
        adapter: "lodestones/MOSS-Image-SFT-8-steps-dmd"
        text_encoder_4bit: true
    ming_design:
        max_output_size: 1024
        steps: 12
        encoder_gguf: "models/ming-image/Text Encoders (UPDATED)/Ming-Image-0.1-Ling-Mini-2.0-Q4_K_M.gguf"
        dit_gguf: "models/ming-image/Ming-Image-0.1-Design-Q4_K_M.gguf"
        base_dir: "models/ming-image/official"
    # Fibo 2.0 (Bria): gated official weights, transformer quantized to 4-bit on load.
    # Accept the license on huggingface.co for each repo before first load.
    fibo2:
        max_output_size: 1024
        max_input_edge: 1440
        steps: 30
        base_model: "briaai/Fibo-2.0-dev"
        transformer_4bit: true
        text_encoder_4bit: false
        # Regional torch.compile of the transformer blocks (~45% faster t2i).
        compile_transformer: true
    # Edit-only, fixed four steps, no CFG.
    fibo2editturbo:
        max_output_size: 1024
        max_input_edge: 1440
        base_model: "briaai/Fibo-2.0-edit-turbo"
        transformer_4bit: true
        text_encoder_4bit: false
        compile_transformer: true
    flux3klein:
        max_output_size: 1024
        max_input_edge: 1440
        gguf: "models/flux3_image_klein_sd_Q5_K_M.gguf"
        base_model: "black-forest-labs/flux-3-image-klein"
    flux2klein:
        max_output_size: 1024
        max_input_edge: 1440
    hyper_sdxl:
        max_output_size: 1024
        max_input_edge: 1440
    sd15:
        max_output_size: 512
        max_input_edge: 1440
    sdxs:
        max_output_size: 512
        max_input_edge: 1440
    zimageturbo:
        max_output_size: 1280
        max_input_edge: 1440
